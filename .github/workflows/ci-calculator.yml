# ==============================================================================
# Pipeline Name: Automated CI/CD Workflow for Java Calculator Project
# Purpose: Compile Java source, run JUnit 5 tests, and build/push Docker image
# Trigger: Automated on any push or pull request targeting the 'main' branch
# ==============================================================================

name: Calculator CI Pipeline

# Event Triggers: execute pipeline on push or PR against main branch
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Define execution jobs
jobs:
  # Job 1: Build & Unit Test Stage (Preserved from Lab 5)
  build-and-test:
    name: Build & Test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: ['17', '21']
      fail-fast: false

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK ${{ matrix.java-version }})
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Compile Java Source
        run: mvn clean compile --batch-mode

      - name: Run JUnit 5 Unit Tests
        run: mvn test --batch-mode

  # Job 2: Docker Containerization Stage (Lab 6 Extension)
  docker-build:
    name: Build & Push Docker Image
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image Locally
        run: |
          docker build -t calculator:latest .

      - name: Verify Container Execution
        run: |
          echo "Verifying default entrypoint execution:"
          docker run --rm calculator:latest
          echo "Verifying arithmetic addition (10 + 20):"
          docker run --rm calculator:latest 10 + 20
          echo "Verifying arithmetic division (100 / 4):"
          docker run --rm calculator:latest 100 / 4

      - name: Tag and Push Docker Image to Docker Hub
        run: |
          docker tag calculator:latest ${{ secrets.DOCKERHUB_USERNAME }}/calculator:lab6
          docker tag calculator:latest ${{ secrets.DOCKERHUB_USERNAME }}/calculator:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/calculator:lab6
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/calculator:latest

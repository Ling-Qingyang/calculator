# ==============================================================================
# Pipeline Name: Automated Multi-Container CI/CD Workflow for Calculator
# Purpose: Compile Java source, run JUnit 5 tests, and validate Docker Compose build
# Trigger: Automated on any push or pull request targeting the 'main' branch
# ==============================================================================

name: Calculator Multi-Container CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Build & Unit Test Stage (Java Backend)
  # ----------------------------------------------------------------------------
  build-and-test:
    name: Backend Build & Test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java-version: ['17', '21']
      fail-fast: false

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK ${{ matrix.java-version }})
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java-version }}
          cache: 'maven'

      - name: Compile Backend Java Source
        working-directory: backend
        run: mvn clean compile --batch-mode

      - name: Run JUnit 5 Unit Tests
        working-directory: backend
        run: mvn test --batch-mode

  # ----------------------------------------------------------------------------
  # Job 2: Docker Compose Multi-Container Build Validation (Lab 7 Extension)
  # ----------------------------------------------------------------------------
  compose-build-and-verify:
    name: Docker Compose Build & Smoke Verification
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Compose File Syntax and Configuration
        run: |
          echo "Validating docker-compose.yml configuration syntax..."
          docker compose config

      - name: Build All Services via Docker Compose
        run: |
          echo "Building backend and web container images..."
          docker compose build

      - name: Ephemeral Smoke Test Execution
        run: |
          echo "Starting multi-container stack in detached mode..."
          docker compose up -d
          
          echo "Inspecting running services status..."
          docker compose ps
          
          echo "Verifying backend health endpoint via web reverse proxy..."
          for i in {1..15}; do
            if curl -s http://127.0.0.1:8080/health | grep -q "UP"; then
              echo "Healthcheck PASSED on attempt $i!"
              break
            fi
            echo "Waiting for service to be healthy... ($i/15)"
            sleep 2
          done

          echo "Verifying inter-service arithmetic calculation API (25 * 4 = 100)..."
          CALC_RES=$(curl -s "http://127.0.0.1:8080/api/calculate?a=25&op=%2A&b=4")
          echo "API Response: $CALC_RES"
          echo "$CALC_RES" | grep -q "100"

          echo "Inspecting container logs..."
          docker compose logs --tail 20

          echo "Stopping and tearing down compose stack..."
          docker compose down

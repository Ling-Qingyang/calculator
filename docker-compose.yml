# ==============================================================================
# Docker Compose Multi-Container Orchestration Specification
# Course: Software Development Tools - Lab 7
# Application: Distributed Calculator (Web Frontend + Backend API Microservice)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # Service 1: Backend Calculation API Microservice
  # ----------------------------------------------------------------------------
  backend:
    # Build from local backend/ directory containing multi-stage Dockerfile
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: calculator-backend:latest
    container_name: calculator-backend
    # Map container port 8000 to host port 8000 for direct API access & debugging
    ports:
      - "8000:8000"
    # Inject application runtime configuration via environment variables
    environment:
      - PORT=8000
      - LOG_LEVEL=INFO
      - APP_ENV=production
    # Container restart policy on failure
    restart: on-failure
    # Health check for service readiness probing
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - calc-network

  # ----------------------------------------------------------------------------
  # Service 2: Web Frontend & Reverse Proxy
  # ----------------------------------------------------------------------------
  web:
    # Build from local web/ directory containing Nginx Dockerfile
    build:
      context: ./web
      dockerfile: Dockerfile
    image: calculator-web:latest
    container_name: calculator-web
    # Map container port 80 to host port 8080 for web browser access
    ports:
      - "8080:80"
    # Service startup dependency: web container starts after backend container
    depends_on:
      backend:
        condition: service_started
    # Inject environment variables for service discovery
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
      - NGINX_PORT=80
    # Container restart policy on failure
    restart: on-failure
    networks:
      - calc-network

# ------------------------------------------------------------------------------
# Bridge Network Configuration for Inter-Container Communication
# Enables automatic DNS resolution of service names ('backend', 'web')
# ------------------------------------------------------------------------------
networks:
  calc-network:
    driver: bridge

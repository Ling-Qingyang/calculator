# ==============================================================================
# Nginx Reverse Proxy & Static Web Server Configuration
# Multi-Container Topology: Service 'web' forwards to 'backend' via Docker DNS
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Root directory for frontend static HTML, CSS, and JavaScript
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Static file serving with client-side fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend calculation API
    # CRITICAL: Target hostname must be Docker Compose internal service name 'backend'
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Proxy timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # Reverse proxy for backend health check endpoint
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Custom error response
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
